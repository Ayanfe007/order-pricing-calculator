<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="850" viewBox="0 0 1500 850" role="img" aria-labelledby="title desc">
<title id="title">Before and after package diagram</title>
<desc id="desc">The Week 2 mixed store and store.domain packages compared with the Week 3 app, model, service, repository, validation, exception, and util packages.</desc>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity=".12"/></filter>
  <style>
    text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#0f172a}
    .panel{fill:#fff;stroke:#dbe3ee;stroke-width:2;rx:22;filter:url(#shadow)}
    .box{stroke-width:2;rx:14;filter:url(#shadow)}
    .pkg{font-size:18px;font-weight:750}
    .items{font-size:14px;fill:#334155}
    .sub{font-size:14px;fill:#64748b}
    .arrow{fill:none;stroke:#64748b;stroke-width:2.5;marker-end:url(#arrow)}
    .label{font-size:12px;fill:#475569;font-weight:650}
  </style>
</defs>
<rect width="1500" height="850" fill="#f1f5f9"/>
<text x="50" y="50" font-size="30" font-weight="800">Week 2 → Week 3 · Package structure</text>
<text x="50" y="78" class="sub">Before: concerns concentrated in two packages. After: dependencies flow through clear application boundaries.</text>

<!-- Before panel -->
<rect class="panel" x="35" y="105" width="500" height="700"/>
<text x="65" y="145" font-size="21" font-weight="800" fill="#b45309">BEFORE · Week 02</text>
<text x="65" y="170" class="sub">Mixed responsibilities and a pricing bridge inside the aggregate</text>
<rect class="box" x="70" y="205" width="430" height="210" fill="#fff7ed" stroke="#f59e0b"/>
<text x="92" y="238" class="pkg">store/ (root package)</text>
<text x="92" y="270" class="items">ConsoleApp · CatalogApp · OrderCalculator</text>
<text x="92" y="296" class="items">PricingConfig · PriceBreakdown</text>
<text x="92" y="322" class="items">Order / OrderItem (pricing request)</text>
<text x="92" y="348" class="items">CustomerType · DeliveryZone</text>
<text x="92" y="385" class="sub">Console I/O, pricing, and request models sit together.</text>
<rect class="box" x="70" y="470" width="430" height="190" fill="#fff1f2" stroke="#fb7185"/>
<text x="92" y="503" class="pkg">store.domain/</text>
<text x="92" y="535" class="items">Customer · Product · Order (lifecycle)</text>
<text x="92" y="561" class="items">OrderItem · Payment · Delivery · Address</text>
<text x="92" y="587" class="items">OrderStatus · PaymentStatus · DeliveryStatus</text>
<text x="92" y="630" class="sub">Domain Order also mapped itself into the pricing package.</text>
<path class="arrow" d="M285 470 C285 445 285 438 285 415"/>
<text x="300" y="448" class="label">direct dependency</text>
<rect x="70" y="692" width="430" height="75" rx="12" fill="#fff7ed" stroke="#fdba74"/>
<text x="92" y="723" class="items" font-weight="700">Risks: tight coupling · duplicated receipt output</text>
<text x="92" y="747" class="items">· no repository boundary · large mixed workflows</text>

<!-- After panel -->
<rect class="panel" x="565" y="105" width="900" height="700"/>
<text x="595" y="145" font-size="21" font-weight="800" fill="#047857">AFTER · Week 03</text>
<text x="595" y="170" class="sub">Layered packages, strategy interfaces, repository boundaries, and one-way dependencies</text>

<!-- package nodes -->
<rect class="box" x="610" y="215" width="255" height="142" fill="#eff6ff" stroke="#60a5fa"/>
<text x="632" y="248" class="pkg">app/</text>
<text x="632" y="278" class="items">Console / catalog entry points</text>
<text x="632" y="302" class="items">ConsoleInput · receipt printer</text>
<text x="632" y="332" class="sub">I/O only</text>

<rect class="box" x="950" y="205" width="465" height="225" fill="#ecfdf5" stroke="#34d399"/>
<text x="973" y="239" class="pkg">service/</text>
<text x="973" y="271" class="items">OrderApplicationService · OrderPricingService</text>
<text x="973" y="296" class="items">DiscountPolicy → Tiered · Promo · CustomerType · Composite</text>
<text x="973" y="321" class="items">ShippingCalculator → Zone · Free · Threshold</text>
<text x="973" y="346" class="items">PaymentProcessor → Card · BankTransfer</text>
<text x="973" y="390" class="sub">Use cases + composed strategies; no console I/O</text>

<rect class="box" x="610" y="445" width="255" height="130" fill="#f5f3ff" stroke="#a78bfa"/>
<text x="632" y="478" class="pkg">repository/</text>
<text x="632" y="508" class="items">OrderRepository</text>
<text x="632" y="532" class="items">ProductRepository</text>
<text x="632" y="557" class="sub">In-memory adapters supplied</text>

<rect class="box" x="610" y="620" width="255" height="145" fill="#fefce8" stroke="#facc15"/>
<text x="632" y="653" class="pkg">model/</text>
<text x="632" y="683" class="items">Order aggregate · Customer · Product</text>
<text x="632" y="707" class="items">Payment · Delivery · value objects</text>
<text x="632" y="739" class="sub">Business state; no service dependency</text>

<rect class="box" x="965" y="495" width="195" height="105" fill="#fdf2f8" stroke="#f472b6"/>
<text x="985" y="528" class="pkg">validation/</text>
<text x="985" y="557" class="items">Named validators</text>
<text x="985" y="582" class="sub">Reusable rules</text>

<rect class="box" x="1210" y="495" width="205" height="105" fill="#fff1f2" stroke="#fb7185"/>
<text x="1230" y="528" class="pkg">exception/</text>
<text x="1230" y="557" class="items">Typed domain errors</text>
<text x="1230" y="582" class="sub">Broad catch compatibility</text>

<rect class="box" x="965" y="650" width="450" height="95" fill="#f8fafc" stroke="#94a3b8"/>
<text x="985" y="683" class="pkg">util/</text>
<text x="985" y="713" class="items">PricingConfig · Money · PricingFormat</text>

<!-- dependency arrows -->
<path class="arrow" d="M865 260 C900 260 915 260 948 260"/><text x="873" y="247" class="label">uses</text>
<path class="arrow" d="M737 357 C737 392 737 405 737 443"/><text x="750" y="405" class="label">catalog data</text>
<path class="arrow" d="M865 312 C905 360 905 570 865 656"/><text x="876" y="492" class="label">uses</text>
<path class="arrow" d="M1015 430 C963 485 900 580 865 660"/><text x="908" y="550" class="label">uses</text>
<path class="arrow" d="M950 373 C910 415 895 465 865 500"/><text x="884" y="435" class="label">repositories</text>
<path class="arrow" d="M737 575 C737 592 737 603 737 618"/><text x="750" y="603" class="label">stores</text>
<path class="arrow" d="M865 680 C905 650 930 595 963 560"/><text x="879" y="620" class="label">validates</text>
<path class="arrow" d="M1160 548 L1208 548"/><text x="1165" y="535" class="label">throws</text>
<path class="arrow" d="M1140 430 C1175 455 1240 463 1295 493"/><text x="1180" y="466" class="label">uses</text>
<path class="arrow" d="M1295 600 C1295 620 1295 630 1295 648"/><text x="1308" y="628" class="label">shared</text>

<text x="595" y="785" class="sub">Key: arrows point from a consumer/dependent package to the package it uses.</text>
</svg>
